{% extends "base.html" %}
{% block title %}Register · Password Strength Analyser{% endblock %}

{% block content %}
<div class="container narrow" style="padding-top:56px;padding-bottom:56px">
  <div class="center mb-3">
    <h1 style="font-size:24px">Create an account</h1>
    <p class="muted small mb-0">Your history is visible only to you.</p>
  </div>

  <div class="card">
    <div class="card-body">
      <form method="post" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input class="input" id="username" name="username" type="text"
                 placeholder="at least 3 characters" required autofocus>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input class="input" id="email" name="email" type="email"
                 placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input class="input" id="password" name="password" type="password"
                 placeholder="at least 8 characters" required>
        </div>
        <button class="btn primary block" type="submit">Create account</button>
      </form>
    </div>
  </div>

  <p class="center muted small mt-2">
    Already registered? <a href="{{ url_for('login') }}">Log in</a>
  </p>
</div>
{% endblock %}
